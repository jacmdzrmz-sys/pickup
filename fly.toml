# fly.toml app configuration file generated for pickup-cgpjew on 2026-11-16T01:49:30Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'pickup-cgpjew'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[processes]
  app = 'npm start'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
